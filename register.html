<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Member Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/register.css') }}">
</head>

<body>

    <main class="register-page">

        <div id="register-card" class="register-card">

            <div class="box-icon">
                👤
            </div>

            <h1>Staff Member Registration</h1>

            <p class="subtitle">
                Create your account to access the inventory system
            </p>

            <!-- Flash messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="messages">
                        {% for category, message in messages %}
                            <div class="message {{ category }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form id="register-form"
                  method="POST"
                  action="{{ url_for('auth.register') }}">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        value="{{ name|default('') }}"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        value="{{ email|default('') }}"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                    >
                </div>

                <div class="form-group">
                    <label for="employee_id">Employee ID</label>
                    <input
                        type="text"
                        id="employee_id"
                        name="employee_id"
                        placeholder="Enter your employee ID"
                        value="{{ employee_id|default('') }}"
                    >
                </div>

                <button
                    type="submit"
                    id="register-btn"
                    class="btn-primary">
                    Register
                </button>

            </form>

            <div class="login-section">
                <span>Already have an account?</span>
                <a
                    href="{{ url_for('auth.login') }}"
                    id="login-link">
                    Login here
                </a>
            </div>

        </div>

    </main>

</body>
</html>
